[tool.poetry]
name = "jarvis-host-agent"
version = "0.1.0"
description = "Uniform OS control for the machine a Jarvis node runs on"
authors = ["Jarvis Automation"]
readme = "README.md"
license = "AGPL-3.0-only"
packages = [{include = "jarvis_host_agent"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115.0,<0.129.0"
uvicorn = {extras = ["standard"], version = ">=0.30,<0.40"}
pydantic = ">=2.9.0,<3.0.0"

# Windows-only. pycaw reaches WASAPI for master volume; pywin32 covers window
# enumeration and control. Both are import-guarded, so a missing wheel degrades
# to absent capabilities rather than a crash at startup.
pywin32 = {version = ">=306,<312", markers = "sys_platform == 'win32'"}
pycaw = {version = ">=20240210,<20250000", markers = "sys_platform == 'win32'"}
comtypes = {version = ">=1.4.1,<2.0.0", markers = "sys_platform == 'win32'"}

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0,<9.0.0"
pytest-cov = ">=5.0.0,<8.0.0"
httpx = ">=0.27.0,<0.29.0"
ruff = ">=0.6.0,<0.15.0"

[tool.poetry.scripts]
jarvis-host-agent = "jarvis_host_agent.app:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "native: exercises the real host; only runs on the matching OS",
]
# The contract + API suites run everywhere; native tests are opt-in per runner.
addopts = "-m 'not native'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
