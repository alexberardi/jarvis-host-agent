name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The contract suite is the point of the matrix: a Windows-only mistake in a
  # provider is caught by the Linux and macOS runners too, because every
  # provider is constructible and inspectable on every OS.
  contract:
    name: contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install --upgrade "pip==25.2"
          pip install "poetry==2.1.3"
          poetry install --no-interaction
      - name: Contract + API suites
        run: poetry run pytest -q
      - name: Native suite (this runner's own OS)
        # Capabilities absent on a headless/permissionless runner make these
        # skip rather than fail -- which is itself the behaviour under test.
        run: poetry run pytest -m native -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install "ruff==0.14.0"
      - run: ruff check .
      - run: ruff format --check .

  openapi:
    name: openapi schema generates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade "pip==25.2"
          pip install "poetry==2.1.3"
          poetry install --no-interaction
      - run: poetry run python openapi_dump.py openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json
