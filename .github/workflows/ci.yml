name: ci

on:
  push:
    branches: [main, go-rewrite]
  pull_request:

permissions:
  contents: read

jobs:
  # The contract suite is the point of the matrix: every backend is constructible and tested on
  # every OS, so a Windows-only mistake fails the Linux and macOS runners too. Each runner also
  # drives its own real host (native tests), which skip what a headless runner can't do.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install jarvis-command-sdk (sidecar spike test)
        run: python -m pip install "git+https://github.com/alexberardi/jarvis-command-sdk@main"
      - name: Unit, contract and sidecar tests (race)
        env:
          CGO_ENABLED: '1'
          JARVIS_SIDECAR_PYTHON: python
        run: go test -race -count=1 ./...
      - name: Native tests (this runner's own OS)
        env:
          JARVIS_HOST_NATIVE: '1'
        run: go test -count=1 -v -run Native ./internal/host/
      - name: Static build (CGO_ENABLED=0)
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o dist/ ./cmd/jarvis-agent

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet (linux, darwin, windows)
        env:
          CGO_ENABLED: '0'
        run: |
          for os in linux darwin windows; do
            echo "== $os"
            GOOS=$os go vet ./...
          done
      - name: Cross-build every target
        env:
          CGO_ENABLED: '0'
        run: |
          for t in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath -o /dev/null ./cmd/jarvis-agent
          done
